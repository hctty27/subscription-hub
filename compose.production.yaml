name: subscription-hub-prod

services:
  api:
    image: subhub-api
    container_name: subhub-api
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DB_PATH: /data/subscription-hub.db
      BACKUP_DIR: /data/backups
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your private environment file}
      SESSION_SECURE: "true"
      NOTIFY_SMTP_HOST: ${NOTIFY_SMTP_HOST:-}
      NOTIFY_SMTP_PORT: ${NOTIFY_SMTP_PORT:-}
      NOTIFY_SMTP_USER: ${NOTIFY_SMTP_USER:-}
      NOTIFY_SMTP_PASSWORD: ${NOTIFY_SMTP_PASSWORD:-}
      NOTIFY_SMTP_FROM: ${NOTIFY_SMTP_FROM:-}
      NOTIFY_SMTP_TO: ${NOTIFY_SMTP_TO:-}
      NOTIFY_TELEGRAM_BOT_TOKEN: ${NOTIFY_TELEGRAM_BOT_TOKEN:-}
      NOTIFY_TELEGRAM_CHAT_ID: ${NOTIFY_TELEGRAM_CHAT_ID:-}
      NOTIFY_BARK_DEVICE_KEY: ${NOTIFY_BARK_DEVICE_KEY:-}
    expose:
      - "8080"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks:
      - my-network

  web:
    image: subhub-web
    container_name: subhub-web
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-127.0.0.1:18080}:80"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/cache/nginx
    security_opt:
      - no-new-privileges:true
    networks:
      - my-network

networks:
  my-network:
    external: true
