name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - run: go mod tidy
      - run: go test ./...
      - run: go vet ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare development data directory
        run: sh scripts/migrate-data-volumes.sh development
      - name: Build and start containers
        run: ADMIN_PASSWORD=ci-long-test-password-456 docker compose up -d --build
      - name: Verify HTTP services
        run: |
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null &&
               curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/api/v1/health -o /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          curl -fsS http://127.0.0.1:5173/ -o /tmp/frontend.html
          grep -q 'Subscription Hub' /tmp/frontend.html
          curl -fsS http://127.0.0.1:5173/api/v1/health -o /tmp/proxied-health.json
          grep -q '"status":"ok"' /tmp/proxied-health.json
      - name: Verify protected API and login
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/items)
          test "$code" = "401"
          curl -fsS -c /tmp/admin-cookies.txt -X POST http://127.0.0.1:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' -H 'X-CSRF-Token: 1' \
            -d '{"password":"ci-long-test-password-456"}' -o /tmp/login.json
          grep -q '"authenticated":true' /tmp/login.json
          curl -fsS -b /tmp/admin-cookies.txt http://127.0.0.1:8080/api/v1/auth/me \
            -o /tmp/me.json
          grep -q '"authenticated":true' /tmp/me.json
      - name: Verify CRUD and persistent bind mount
        run: |
          curl -fsS -b /tmp/admin-cookies.txt -X POST http://127.0.0.1:8080/api/v1/items \
            -H 'Content-Type: application/json' -H 'X-CSRF-Token: 1' \
            -d '{"name":"CI 订阅","kind":"subscription","status":"active","amount_minor":2000,"currency":"USD","period_unit":"month","period_count":1,"first_due_date":"2026-01-31","notes":""}' \
            -o /tmp/created.json
          grep -q '"name":"CI 订阅"' /tmp/created.json
          docker compose restart backend
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS -b /tmp/admin-cookies.txt 'http://127.0.0.1:8080/api/v1/items?limit=10' -o /tmp/items.json
          grep -q '"name":"CI 订阅"' /tmp/items.json
          docker run --rm -v "$PWD/data-dev:/check:ro" alpine:3.22 sh -c 'test -f /check/subscription-hub.db'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down

  production-smoke:
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: ci-prod-long-password-123
      HTTP_BIND: "127.0.0.1:18080"
      RESTIC_REPOSITORY: /repo
      RESTIC_PASSWORD: ci-restic-backup-password
      SUBSCRIPTION_ENV_FILE: .env.production.example
    steps:
      - uses: actions/checkout@v4
      - name: Prepare shared Docker network
        run: docker network create my-network
      - name: Validate production Compose and shell scripts
        run: |
          docker compose --env-file .env.production.example -f compose.production.yaml config --quiet
          sh -n scripts/backup-offsite.sh
          sh -n scripts/smoke-production.sh
          sh -n scripts/migrate-data-volumes.sh
      - name: Verify explicit production Compose selection
        run: |
          test ! -e compose.production.user.yaml
          git check-ignore -q compose.production.user.yaml
          cp compose.production.yaml compose.production.user.yaml
          sed -i 's/image: subhub-web$/image: subhub-web-custom/' compose.production.user.yaml
          COMPOSE_FILE=compose.production.user.yaml docker compose --env-file .env.production.example config --format json | jq -e '.services.web.image == "subhub-web-custom"'
          docker compose --env-file .env.production.example -f compose.production.yaml config --format json | jq -e '.services.web.image == "subhub-web"'
          rm compose.production.user.yaml
          sh -n scripts/backup-offsite.sh
          sh -n scripts/migrate-data-volumes.sh
      - name: Prepare production data directory
        run: sh scripts/migrate-data-volumes.sh production
      - name: Build and start production containers
        run: docker compose --env-file .env.production.example -f compose.production.yaml up -d --build
      - name: Verify Nginx configuration, frontend, API, login and CSRF
        run: |
          docker compose --env-file .env.production.example -f compose.production.yaml exec -T web nginx -t
          sh scripts/smoke-production.sh
      - name: Verify SQLite snapshot and encrypted Restic backup
        run: |
          docker compose --env-file .env.production.example -f compose.production.yaml exec -T api /app/backup
          docker compose --env-file .env.production.example -f compose.production.yaml --profile backup run --rm --no-deps restic init
          sh scripts/backup-offsite.sh
          docker compose --env-file .env.production.example -f compose.production.yaml --profile backup run --rm --no-deps restic snapshots --json > /tmp/restic-snapshots.json
          grep -q 'subscription-hub' /tmp/restic-snapshots.json
          docker run --rm -v "$PWD/data:/check:ro" alpine:3.22 sh -c '
            test -f /check/subscription-hub.db
            test -d /check/backups
            test -n "$(find /check/backups -type f -print -quit)"
          '
      - name: Show production logs on failure
        if: failure()
        run: docker compose --env-file .env.production.example -f compose.production.yaml logs --no-color
      - name: Stop production containers
        if: always()
        run: docker compose --env-file .env.production.example -f compose.production.yaml down
      - name: Remove CI Docker network
        if: always()
        run: docker network rm my-network || true

  data-migration:
    runs-on: ubuntu-latest
    env:
      SUBSCRIPTION_ENV_FILE: .env.production.example
    steps:
      - uses: actions/checkout@v4
      - name: Seed legacy named volumes
        run: |
          docker volume create subscription-hub-prod_subscription_data
          docker volume create subscription-hub_subscription_data
          docker run --rm -v subscription-hub-prod_subscription_data:/old alpine:3.22 sh -c '
            mkdir -p /old/backups
            printf old-prod > /old/subscription-hub.db
            printf snapshot > /old/backups/previous.db
            printf wal > /old/subscription-hub.db-wal
          '
          docker run --rm -v subscription-hub_subscription_data:/old alpine:3.22 sh -c '
            printf old-dev > /old/subscription-hub.db
          '
      - name: Verify migration preserves database and backups
        run: |
          sh scripts/migrate-data-volumes.sh production
          sh scripts/migrate-data-volumes.sh development
          docker run --rm -v "$PWD/data:/check:ro" alpine:3.22 sh -c '
            test "$(cat /check/subscription-hub.db)" = old-prod
            test "$(cat /check/backups/previous.db)" = snapshot
            test "$(cat /check/subscription-hub.db-wal)" = wal
            test "$(stat -c %u /check)" = 10001
            test "$(stat -c %u /check/subscription-hub.db)" = 10001
          '
          docker run --rm -v "$PWD/data-dev:/check:ro" alpine:3.22 sh -c '
            test "$(cat /check/subscription-hub.db)" = old-dev
            test "$(stat -c %u /check)" = 10001
          '
          if sh scripts/migrate-data-volumes.sh production; then
            echo "迁移脚本没有拒绝非空数据目录" >&2
            exit 1
          fi
          docker volume inspect subscription-hub-prod_subscription_data >/dev/null
          docker volume inspect subscription-hub_subscription_data >/dev/null
